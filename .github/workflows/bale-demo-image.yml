name: bale-demo-image

# Builds a Docker image of this fork for git-bale demos and pushes it to GHCR
# under ghcr.io/<owner>/gitea. The image is tagged with the branch name (so
# `docker pull ghcr.io/<owner>/gitea:bale-support` gives the latest build) and
# with the short commit SHA for traceability.

on:
  push:
    branches: [bale-support, bale-support-v1.2]
  workflow_dispatch:
    inputs:
      hello:
        description: Nothing
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Full history + tags so `git describe` produces a meaningful version
      # string baked into the binary.
      - run: git fetch --unshallow --quiet --tags --force

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gitea
          tags: |
            type=ref,event=branch

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gitea:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gitea:buildcache,mode=max
